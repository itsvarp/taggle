name: taggle-infisical

# Local-only Infisical. All ports are bound to 127.0.0.1.
# Secrets for this stack live in ./.env (generated by ./bootstrap.sh, chmod 600, gitignored).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?run ./bootstrap.sh first}
      POSTGRES_DB: infisical
    volumes:
      - infisical_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - infisical_redis:/data

  infisical:
    # Pinned: the `latest-postgres` tag on Docker Hub is stale and lacks API routes
    # the current CLI uses (/api/v4/secrets). Plain vX.Y.Z tags are the current builds.
    image: infisical/infisical:v0.167.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?run ./bootstrap.sh first}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?run ./bootstrap.sh first}
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD}@db:5432/infisical
      REDIS_URL: redis://redis:6379
      SITE_URL: http://localhost:8080
      TELEMETRY_ENABLED: "false"

volumes:
  infisical_pg:
  infisical_redis:
